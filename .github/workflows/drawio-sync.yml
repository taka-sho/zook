name: draw.io sync

# Triggered when a `.drawio` file is pushed (typically via draw.io's own
# GitHub/GitLab storage integration - a user edits the diagram and "Save"
# commits it directly). Runs `zook sync` for each changed .drawio
# against its same-named .yaml sibling (X.drawio <-> X.yaml, same
# directory) and opens a PR with the updated YAML if anything changed. If
# a sync run produces no diff (e.g. the edit only touched color/added a
# shape - out of scope for sync), no PR is opened.
on:
  push:
    paths:
      - "**/*.drawio"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -e .

      - name: Sync changed .drawio files into their paired YAML
        run: |
          set -eu
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before="HEAD^"
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}" -- '*.drawio' || true)
          if [ -z "$changed" ]; then
            echo "No .drawio files changed; nothing to sync."
            exit 0
          fi
          for drawio in $changed; do
            yaml="${drawio%.drawio}.yaml"
            if [ ! -f "$yaml" ]; then
              echo "::warning::${drawio}: no matching ${yaml} (same-basename convention) - skipped"
              continue
            fi
            echo "Syncing ${drawio} -> ${yaml}"
            zook sync "$yaml" "$drawio" -o "$yaml"
          done

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the updated YAML
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync diagram position/size changes from draw.io"
          title: "Sync draw.io position/size changes"
          body: >
            Position/size changes made in draw.io, synced back into the
            diagram YAML by `zook sync`. Structural edits (added/
            removed shapes, color/style changes) are out of scope and were
            not applied - see docs/detailed-design-pptx.md sec8.14.
          branch: zook-sync/${{ github.run_id }}
          base: ${{ github.ref_name }}
