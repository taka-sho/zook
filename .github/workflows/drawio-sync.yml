name: draw.io sync

# Triggered when a `.drawio` file is pushed (typically via draw.io's own
# GitHub/GitLab storage integration - a user edits the diagram and "Save"
# commits it directly). Runs `zook sync` for each added/modified .drawio
# against its same-named .yaml sibling (X.drawio <-> X.yaml, same
# directory) and opens a PR with the updated YAML if anything changed. If
# a sync run produces no diff (nothing moved - e.g. the edit only touched
# colour, which sync doesn't carry over), `sync` leaves the YAML untouched
# and no PR is opened. The PR only ever changes .yaml files, so merging it
# never re-triggers this workflow.
#
# To use it in your own repository, copy this file and replace the
# `pip install -e .` step with `pip install zook` (see
# docs-site/drawio-sync.md).
on:
  push:
    paths:
      - "**/*.drawio"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: a push can carry several commits, and every
          # .drawio changed since the previous head must be synced
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -e .

      - name: Sync changed .drawio files into their paired YAML
        id: sync
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -u
          # The first push of a branch (or a force push) has no usable
          # "before": diff against the parent instead.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse --verify --quiet "$AFTER^" || git hash-object -t tree /dev/null)"
          fi
          failed=0
          # -z / read -d '': file names with spaces or non-ASCII characters
          # arrive intact; --diff-filter=AMR: a deleted .drawio has nothing
          # to sync (and a renamed one is synced under its new name).
          while IFS= read -r -d '' drawio; do
            yaml="${drawio%.drawio}.yaml"
            if [ ! -f "$yaml" ]; then
              echo "::warning file=${drawio}::no matching ${yaml} (same-basename convention) - skipped"
              continue
            fi
            echo "Syncing ${drawio} -> ${yaml}"
            if ! zook sync "$yaml" "$drawio" -o "$yaml" --format github; then
              failed=1
            fi
          done < <(git diff -z --name-only --diff-filter=AMR "$BEFORE" "$AFTER" -- '*.drawio')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the updated YAML
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync diagram position/size changes from draw.io"
          title: "Sync draw.io position/size changes"
          body: >
            Position/size changes (and edited link bend points) made in
            draw.io, synced back into the diagram YAML by `zook sync`.
            Structural edits (added/removed/re-parented shapes, colour/style
            and label changes) are out of scope and were not applied - see
            the warnings in this workflow run and docs-site/drawio-sync.md.
          branch: zook-sync/${{ github.run_id }}
          base: ${{ github.ref_name }}

      - name: Fail if any sync failed
        if: steps.sync.outputs.failed == '1'
        run: |
          echo "::error::zook sync failed for at least one .drawio file - see the annotations above"
          exit 1
