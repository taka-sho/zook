name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install zensical
      # English (docs-site/) is the primary site, built to site/. Japanese
      # (docs-site-ja/) is a completely separate docs tree, built into site/ja/
      # via its own config (site_dir differs, so this doesn't clobber the
      # English build) - see docs-site/index.md's language-switcher link.
      - run: zensical build --clean --strict -f zensical.toml
      - run: zensical build --clean --strict -f zensical.ja.toml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
