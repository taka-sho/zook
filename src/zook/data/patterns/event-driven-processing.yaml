version: "1.0"
# An asynchronous, loosely-coupled processing pipeline.
# EventBridge detects an S3 upload, SQS buffers it, and Lambda processes it.
# Fits "no synchronous response needed" / "downstream backpressure shouldn't block ingestion."

canvas:
  aspectRatio: "16:9"
  padding: 40

elements:
  - kind: container
    id: aws
    type: cloud
    label: "AWS Cloud"
    layout:
      direction: horizontal
      gap: 56
    children:
      - kind: node
        id: bucket
        type: S3
        label: "Upload Bucket"
      - kind: node
        id: events
        type: EventBridge
        label: "Event Bus"
      - kind: node
        id: queue
        type: SQS
        label: "Processing Queue"
      - kind: node
        id: worker
        type: Lambda
        label: "Worker"
      - kind: node
        id: table
        type: DynamoDB
        label: "Result Table"
      - kind: node
        id: notify
        type: SNS
        label: "Completion Topic"

links:
  - from: bucket
    to: events
    label: "ObjectCreated"
  - from: events
    to: queue
  - from: queue
    to: worker
    label: "poll"
  - from: worker
    to: table
    label: "store"
  - from: worker
    to: notify
    fromSide: bottom
    toSide: bottom
