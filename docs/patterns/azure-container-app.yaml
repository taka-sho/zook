version: "1.0"
# Container app setup on Azure (the Azure counterpart of container-platform.yaml).
# Front Door receives HTTPS, Container Apps runs the app, and Cosmos DB persists the data.
# Auth is via Entra ID. A good base when Azure is explicitly required.

canvas:
  aspectRatio: "16:9"
  padding: 40

elements:
  - kind: node
    id: user
    type: User
    label: "End User"

  - kind: container
    id: azure
    type: cloud
    provider: azure
    label: "Microsoft Azure"
    layout:
      direction: vertical
      gap: 48
    children:
      - kind: node
        id: entra
        type: EntraID
        provider: azure
        label: "Entra ID"
      - kind: node
        id: frontdoor
        type: FrontDoor
        provider: azure
        label: "Front Door"
      - kind: node
        id: app
        type: ContainerApps
        provider: azure
        label: "Container App"
      - kind: node
        id: cosmos
        type: CosmosDB
        provider: azure
        label: "Cosmos DB"

links:
  - from: user
    to: frontdoor
    label: "HTTPS"
  - from: frontdoor
    to: entra
    label: "authorize"
  - from: frontdoor
    to: app
  - from: app
    to: cosmos
