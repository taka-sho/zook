version: "1.0"
# A serverless API setup.
# API Gateway receives HTTPS requests, Lambda processes them, and DynamoDB persists the data.
# Auth is via Cognito. Fits "no server management wanted" / "start small and grow."

canvas:
  aspectRatio: "16:9"
  padding: 40

elements:
  - kind: node
    id: user
    type: User
    label: "End User"

  - kind: container
    id: aws
    type: cloud
    label: "AWS Cloud"
    layout:
      direction: vertical
      gap: 48
    children:
      - kind: node
        id: cognito
        type: Cognito
        label: "User Pool"
      - kind: node
        id: apigw
        type: APIGateway
        label: "REST API"
      - kind: node
        id: lambda
        type: Lambda
        label: "Business Logic"
      - kind: node
        id: ddb
        type: DynamoDB
        label: "Table"

links:
  - from: user
    to: apigw
    label: "HTTPS + JWT"
  - from: apigw
    to: cognito
    label: "authorize"
  - from: apigw
    to: lambda
  - from: lambda
    to: ddb
