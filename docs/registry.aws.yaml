registryVersion: "1.0"
provider: aws
iconSet: "AWS Architecture Icons (quarterly release) — record the exact release you vendored"
basePath: "."
defaults:
  size: 64
  ext: png

# ---- Nodes: Tier-1 core vocabulary, then the Tier-2 additions ----
# Key = the `type` used in the diagram YAML. Extend by adding entries + files.
# drawioShape values were extracted verbatim from jgraph/drawio's own
# Sidebar-AWS4.js (dev branch) - see docs/detailed-design-pptx.md sec8.14.
# Entries without a verified official shape are left unset; `zook
# export-drawio` falls back to embedding the PNG in `file` for those.
icons:
