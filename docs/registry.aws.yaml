# ---- Containers: frame styles (colors are sensible defaults; align to the official deck) ----
# drawioShape values (where set) are draw.io's official AWS4 "Groups" palette
# entries (container=1 already baked in, so resizing in draw.io never rescales
# children - see sec8.14). Entries without one render as a plain rect in
# export-drawio, using borderColor/fillColor/dashed below.
groups:
  cloud: { label: "AWS Cloud", borderColor: "#232F3E", dashed: false, labelPosition: top-left, icon: "General/aws-cloud-badge.png", drawioShape: "sketch=0;shape=mxgraph.aws4.group;grIcon=mxgraph.aws4.group_aws_cloud;container=1;collapsible=0;recursiveResize=0;strokeColor=#232F3E;fillColor=none;dashed=0;verticalAlign=top;align=left;spacingLeft=30;fontColor=#232F3E;" }
  vpc: { label: "VPC", borderColor: "#8C4FFF", dashed: false, labelPosition: top-left, drawioShape: "sketch=0;shape=mxgraph.aws4.group;grIcon=mxgraph.aws4.group_vpc2;container=1;collapsible=0;recursiveResize=0;strokeColor=#8C4FFF;fillColor=none;dashed=0;verticalAlign=top;align=left;spacingLeft=30;fontColor=#AAB7B8;" }
  az: { label: "Availability Zone", borderColor: "#00A4A6", dashed: true, labelPosition: top-left, aliases: [availabilityZone, zone], drawioShape: "sketch=0;container=1;collapsible=0;recursiveResize=0;strokeColor=#147EBA;fillColor=none;dashed=1;verticalAlign=top;fontColor=#147EBA;whiteSpace=wrap;html=1;" }
  subnet: { label: "Subnet", borderColor: "#7AA116", fillColor: "#F2F8E8", labelPosition: top-left, drawioShape: "sketch=0;shape=mxgraph.aws4.group;grIcon=mxgraph.aws4.group_security_group;grStroke=0;container=1;collapsible=0;recursiveResize=0;strokeColor=#7AA116;fillColor=#F2F6E8;dashed=0;verticalAlign=top;align=left;spacingLeft=30;fontColor=#248814;" }
  region: { label: "Region", borderColor: "#00A4A6", dashed: true, labelPosition: top-left, drawioShape: "sketch=0;shape=mxgraph.aws4.group;grIcon=mxgraph.aws4.group_region;container=1;collapsible=0;recursiveResize=0;strokeColor=#00A4A6;fillColor=none;dashed=1;verticalAlign=top;align=left;spacingLeft=30;fontColor=#147EBA;" }
  account: { label: "AWS Account", borderColor: "#E7157B", dashed: false, labelPosition: top-left, drawioShape: "sketch=0;shape=mxgraph.aws4.group;grIcon=mxgraph.aws4.group_account;container=1;collapsible=0;recursiveResize=0;strokeColor=#CD2264;fillColor=none;dashed=0;verticalAlign=top;align=left;spacingLeft=30;fontColor=#CD2264;" }
