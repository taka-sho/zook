  EC2: { file: "Compute/EC2.png", category: Compute, aliases: [AmazonEC2], drawioShape: "sketch=0;shape=mxgraph.aws4.resourceIcon;resIcon=mxgraph.aws4.ec2;fillColor=#ED7100;strokeColor=#ffffff;outlineConnect=0;fontColor=#232F3E;" }
