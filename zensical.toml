[project]
site_name = "archdiagram"
site_description = "YAML から PowerPoint アーキテクチャ図を生成する CLI ツール"
site_author = "taka-sho"
site_url = "https://taka-sho.github.io/archtecture-diagram-generator/"
docs_dir = "docs-site"
copyright = "Copyright &copy; 2026 taka-sho"

repo_url = "https://github.com/taka-sho/archtecture-diagram-generator"
repo_name = "taka-sho/archtecture-diagram-generator"
edit_uri = "edit/main/docs-site/"

nav = [
    { "はじめに" = "index.md" },
    { "インストール" = "installation.md" },
    { "使い方" = "usage.md" },
    { "YAML入力仕様" = "yaml-guide.md" },
    { "アイコン・レジストリ" = "icons.md" },
    { "draw.io連携(継続的な構成図管理)" = "drawio-sync.md" },
    { "Mermaidフローチャートのインポート" = "mermaid-import.md" },
    { "内部設計メモ" = "design-notes.md" },
    { "既知の制約" = "limitations.md" },
]

[project.theme]
language = "ja"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/network"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/taka-sho/archtecture-diagram-generator"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
