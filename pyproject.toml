[build-system]
requires = ["setuptools>=77"]  # PEP 639: license = "MIT" as a string
build-backend = "setuptools.build_meta"

[project]
name = "zook"
dynamic = ["version"]  # single source: zook.__version__
description = "Generate PowerPoint architecture diagrams from a YAML definition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "taka-sho" }]
keywords = [
    "diagram",
    "diagrams-as-code",
    "architecture",
    "powerpoint",
    "pptx",
    "aws",
    "gcp",
    "azure",
    "drawio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "python-pptx>=1.0.0",
    "cairosvg>=2.7",
    "click>=8.2",
    "pillow>=10.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://taka-sho.github.io/zook/"
Repository = "https://github.com/taka-sho/zook"
Documentation = "https://taka-sho.github.io/zook/"
Changelog = "https://github.com/taka-sho/zook/blob/main/CHANGELOG.md"
Issues = "https://github.com/taka-sho/zook/issues"

[project.scripts]
zook = "zook.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "zook.__version__" }

[tool.coverage.run]
source = ["zook"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.setuptools.package-data]
# Every data file under the package, whatever provider or category folder it
# is in (tests/test_bundled_data.py and CI's wheel smoke test check they ship).
zook = [
    "schemas/*.json",
    "data/**/*.png",
    "data/**/*.yaml",
    "data/**/*.md",
]
