[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zook"
version = "0.1.0"
description = "Generate PowerPoint architecture diagrams from a YAML definition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "taka-sho" }]
keywords = [
    "diagram",
    "diagrams-as-code",
    "architecture",
    "powerpoint",
    "pptx",
    "aws",
    "gcp",
    "azure",
    "drawio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "python-pptx>=1.0.0",
    "cairosvg>=2.7",
    "click>=8.1",
    "pillow>=10.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://taka-sho.github.io/zook/"
Repository = "https://github.com/taka-sho/zook"
Documentation = "https://taka-sho.github.io/zook/"
Changelog = "https://github.com/taka-sho/zook/blob/main/CHANGELOG.md"
Issues = "https://github.com/taka-sho/zook/issues"

[project.scripts]
zook = "zook.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zook = [
    "schemas/*.json",
    "data/icons/aws/**/*.png",
    "data/icons/aws/*.yaml",
    "data/icons/gcp/**/*.png",
    "data/icons/gcp/*.yaml",
    "data/icons/azure/**/*.png",
    "data/icons/azure/*.yaml",
]
