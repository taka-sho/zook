[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archdiagram"
version = "0.1.0"
description = "Generate PowerPoint architecture diagrams from a YAML definition."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "python-pptx>=1.0.0",
    "cairosvg>=2.7",
    "click>=8.1",
]

[project.scripts]
archdiagram = "archdiagram.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archdiagram = ["schemas/*.json", "data/icons/aws/**/*.png", "data/icons/aws/*.yaml"]
